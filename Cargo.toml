[package]
name = "tobywrite"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A quiet, native Markdown editor for Linux and Wayland"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
pangocairo = "0.22"
pulldown-cmark = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "1.1"
unicode-segmentation = "1"
url = "2"
walkdir = "2"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
